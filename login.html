<!DOCTYPE html>
<html lang="en" dir="ltr" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <title>Client Portal Login | Nexus Plastics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { industrial: { 900: '#2a3545', 950: '#1c2431' }, accent: { 500: '#ea580c', 600: '#c2410c' } } } } }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-gray-50 text-gray-900 dark:bg-industrial-950 dark:text-white antialiased min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8 relative">
    
    <div class="absolute top-6 right-6 rtl:left-6 rtl:right-auto flex gap-4">
        <button id="theme-toggle" class="w-10 h-10 rounded bg-white dark:bg-industrial-900 shadow text-gray-500 flex items-center justify-center">
            <i class="fas fa-moon dark:hidden"></i><i class="fas fa-sun hidden dark:block"></i>
        </button>
        <button id="rtl-toggle" class="w-10 h-10 rounded bg-white dark:bg-industrial-900 shadow text-gray-500 font-bold text-xs flex items-center justify-center">
            RTL
        </button>
    </div>

    <div class="max-w-md w-full space-y-8 bg-white dark:bg-industrial-900 p-8 rounded-xl shadow-2xl border border-gray-100 dark:border-gray-800">
        <div class="text-center">
            <a href="index.html" class="inline-flex items-center gap-2 font-bold text-2xl justify-center mb-6">
                <div class="w-10 h-10 bg-accent-500 rounded flex items-center justify-center text-white"><i class="fas fa-cube"></i></div>
                Nexus<span class="text-accent-500">Plastics</span>
            </a>
            <h2 class="text-2xl font-bold">Portal Login</h2>
            <p class="mt-2 text-sm text-gray-500 dark:text-gray-400">Access project status, DFM reports, and part inventory.</p>
        </div>

        <form action="#" method="POST" class="mt-8 space-y-6">
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-1">Business Email</label>
                    <input type="email" required class="w-full bg-gray-50 dark:bg-industrial-950 border border-gray-300 dark:border-gray-700 rounded-lg px-4 py-2.5 focus:ring-2 focus:ring-accent-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Password</label>
                    <div class="relative">
                        <input type="password" required class="w-full bg-gray-50 dark:bg-industrial-950 border border-gray-300 dark:border-gray-700 rounded-lg px-4 py-2.5 focus:ring-2 focus:ring-accent-500 outline-none">
                        <button type="button" class="password-toggle absolute right-3 rtl:left-3 rtl:right-auto top-2.5 text-gray-400"><i class="fas fa-eye"></i></button>
                    </div>
                    <div class="mt-2 text-right rtl:text-left">
                        <a href="#" class="text-sm text-accent-500 hover:underline">Forgot password?</a>
                    </div>
                </div>
            </div>

            <div class="flex items-center">
                <input type="checkbox" id="remember" class="w-4 h-4 text-accent-500 rounded border-gray-300">
                <label for="remember" class="ml-2 rtl:mr-2 rtl:ml-0 text-sm text-gray-600 dark:text-gray-400">Remember this device</label>
            </div>

            <button type="submit" class="w-full bg-accent-500 hover:bg-accent-600 text-white font-bold py-3 rounded-lg shadow-lg shadow-accent-500/30 transition-colors">Access Portal</button>
        </form>

        <div class="mt-6">
            <div class="relative">
                <div class="absolute inset-0 flex items-center">
                    <div class="w-full border-t border-gray-200 dark:border-gray-700"></div>
                </div>
                <div class="relative flex justify-center text-sm">
                    <span class="px-2 bg-white dark:bg-industrial-900 text-gray-500">Or continue with</span>
                </div>
            </div>

            <div class="mt-6 grid grid-cols-2 gap-4">
                <a href="#" class="w-full flex justify-center items-center gap-2 py-2.5 border border-gray-300 dark:border-gray-700 rounded-lg shadow-sm bg-white dark:bg-industrial-950 text-sm font-medium text-gray-700 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-industrial-900 transition-colors">
                    <i class="fab fa-google text-red-500"></i> Google
                </a>
                <a href="#" class="w-full flex justify-center items-center gap-2 py-2.5 border border-gray-300 dark:border-gray-700 rounded-lg shadow-sm bg-white dark:bg-industrial-950 text-sm font-medium text-gray-700 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-industrial-900 transition-colors">
                    <i class="fab fa-apple text-gray-900 dark:text-white"></i> Apple
                </a>
            </div>
        </div>

        <p class="mt-6 text-center text-sm text-gray-500 dark:text-gray-400">
            Don't have a portal account? <a href="signup.html" class="text-accent-500 font-medium hover:underline">Request Access</a>
        </p>
    </div>

    <script src="script.js"></script>
</body>
</html>
